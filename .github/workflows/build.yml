name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/badges/**'
  schedule:
    - cron: '0 3 */2 * *' # every two days, 03:00 UTC

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      sha: ${{ steps.update.outputs.sha }}
      build: ${{ steps.update.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Update
        id: update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git -C vanadium fetch --tags
          latest="$(git -C vanadium tag | sort -V | tail -n1)"
          git fetch https://github.com/jqssun/android-titanium-browser.git main
          if ! git merge --no-edit FETCH_HEAD; then
            # Only a Vanadium submodule conflict is resolved automatically, by taking the latest tag.
            [ "$(git diff --name-only --diff-filter=U)" = vanadium ] || exit 1
            git -C vanadium checkout "$latest"
            git add vanadium
            git commit --no-edit
          fi
          git -C vanadium checkout "$latest"
          git add vanadium
          if ! git diff --staged --quiet; then
            git commit -m "update"
          fi
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Scheduled runs only build when something besides docs and CI changed since the last release.
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -n "$last" ] &&
            git diff --quiet "$last" HEAD -- . ':!README.md' ':!fastlane' ':!.github'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.update.outputs.build == 'true'
        run: ./build.sh free_disk

      - name: Prepare
        if: steps.update.outputs.build == 'true'
        run: ./build.sh prepare

      - name: Save
        if: steps.update.outputs.build == 'true'
        run: |
          mkdir state
          tar --format=posix -cf - chromium depot_tools | zstd -T0 -3 | split -b 4G -d - state/src.tar.zst.
          df -h /

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.build == 'true'
        with:
          name: src
          path: state
          compression-level: 0
          retention-days: 3

  stage1:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 1
    secrets: inherit

  stage2:
    needs: [prepare, stage1]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 2
    secrets: inherit

  stage3:
    needs: [prepare, stage2]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 3
    secrets: inherit

  stage4:
    needs: [prepare, stage3]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 4
    secrets: inherit

  stage5:
    needs: [prepare, stage4]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 5
    secrets: inherit

  stage6:
    needs: [prepare, stage5]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 6
    secrets: inherit

  stage7:
    needs: [prepare, stage6]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 7
    secrets: inherit

  stage8:
    needs: [prepare, stage7]
    uses: ./.github/workflows/stage.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stage: 8
    secrets: inherit

  release:
    needs: [prepare, stage8]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: release

      - name: Set
        run: |
          ls -l release
          echo "VERSION=$(find release -name '*-arm64-v8a.apk' | sed 's/.*\///;s/-arm64-v8a.apk$//')" >> "$GITHUB_ENV"

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}-${{ github.run_number }}
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: release/*.apk

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.apk

      - name: Clean up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name != "apk") | .id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
